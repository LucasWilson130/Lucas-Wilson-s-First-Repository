<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Operations & Search</title>
</head>
<body>
    <h1>Array Operations & Sequential Search</h1>

    <h2>Current Array (Modified & Sorted)</h2>
    <p>The following array of numbers has been modified (numbers removed), sorted in ascending order, and printed to the console:</p>
    <ul id="numberList">
        <script>
            let numbers = [11, 5, 8, 3, 25, 16, 31, 45, 14, 20];
            numbers.push(19, 23, 30); // Add the new numbers (from previous instruction)

            // Remove the numbers 8 and 31
            numbers = numbers.filter(number => number !== 8 && number !== 31);

            numbers.sort((a, b) => a - b); // Sort in ascending order

            let list = document.getElementById('numberList');
            numbers.forEach(number => {
                let listItem = document.createElement('li');
                listItem.textContent = number;
                list.appendChild(listItem);
            });

            // Print the sorted array to the console (for developer view)
            console.log("Current Array:", numbers);

            // --- Sequential Search Function ---
            function sequentialSearch(arr, target) {
                for (let i = 0; i < arr.length; i++) {
                    if (arr[i] === target) {
                        return i; // Return the index if found
                    }
                }
                return -1; // Return -1 if not found
            }

            // --- HTML Elements and Event Listener for Search ---
            window.onload = function() {
                const searchInput = document.getElementById('searchInput');
                const searchButton = document.getElementById('searchButton');
                const searchResult = document.getElementById('searchResult');

                searchButton.addEventListener('click', function() {
                    const searchTerm = parseInt(searchInput.value); // Get input as a number
                    if (isNaN(searchTerm)) {
                        searchResult.textContent = "Please enter a valid number.";
                        searchResult.style.color = "red";
                        return;
                    }

                    const index = sequentialSearch(numbers, searchTerm);

                    if (index !== -1) {
                        searchResult.textContent = `Number ${searchTerm} found at index ${index}.`;
                        searchResult.style.color = "green";
                    } else {
                        searchResult.textContent = `Number ${searchTerm} not found in the array.`;
                        searchResult.style.color = "orange";
                    }
                });
            };
        </script>
    </ul>

    <h2>Sequential Search</h2>
    <p>Enter a number to search for in the array:</p>
    <input type="number" id="searchInput" placeholder="Enter a number">
    <button id="searchButton">Search</button>
    <p id="searchResult"></p>

</body>
</html>
